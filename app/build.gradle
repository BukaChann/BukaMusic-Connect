plugins {
    id 'com.android.application'
}

def buildConfigString = { value ->
    '"' + String.valueOf(value)
            .replace('\\', '\\\\')
            .replace('"', '\\"')
            .replace('\r', '\\r')
            .replace('\n', '\\n') + '"'
}
def updateManifestUrl = System.getenv('BUKA_UPDATE_MANIFEST_URL')
        ?: project.findProperty('bukaUpdateManifestUrl')
        ?: 'https://gitee.com/hanhan2048/BukaMusic-Releases/raw/master/latest.json'
def updatePublicKeyFile = rootProject.file('update-signing-public.pem')
def updateManifestPublicKey = System.getenv('BUKA_UPDATE_MANIFEST_PUBLIC_KEY')
        ?: project.findProperty('bukaUpdateManifestPublicKey')
        ?: (updatePublicKeyFile.exists()
                ? updatePublicKeyFile.getText('UTF-8').trim() : '')
def updateAllowedHosts = System.getenv('BUKA_UPDATE_ALLOWED_HOSTS')
        ?: project.findProperty('bukaUpdateAllowedHosts')
        ?: 'gitee.com,raw.giteeusercontent.com'
def releaseStorePath = System.getenv('BUKA_RELEASE_STORE_FILE')
        ?: project.findProperty('bukaReleaseStoreFile')
def releaseStorePassword = System.getenv('BUKA_RELEASE_STORE_PASSWORD')
        ?: project.findProperty('bukaReleaseStorePassword')
def releaseKeyAlias = System.getenv('BUKA_RELEASE_KEY_ALIAS')
        ?: project.findProperty('bukaReleaseKeyAlias')
def releaseKeyPassword = System.getenv('BUKA_RELEASE_KEY_PASSWORD')
        ?: project.findProperty('bukaReleaseKeyPassword')

android {
    namespace 'com.airmusic.player'
    compileSdk 34

    defaultConfig {
        applicationId "com.airmusic.player"
        minSdk 23
        targetSdk 34
        versionCode 327
        versionName "3.2.7"
        // Public release trust configuration. The private signing key must stay
        // in the protected release environment, never in the repository.
        buildConfigField 'String', 'UPDATE_MANIFEST_URL',
                buildConfigString(updateManifestUrl)
        buildConfigField 'String', 'UPDATE_MANIFEST_PUBLIC_KEY',
                buildConfigString(updateManifestPublicKey)
        buildConfigField 'String', 'UPDATE_ALLOWED_HOSTS',
                buildConfigString(updateAllowedHosts)
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (releaseStorePath) {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseStorePath) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-datasource:1.4.1'
  
      // AirPlay 1 (RAOP) engine
    implementation 'org.jmdns:jmdns:3.5.7'
    implementation 'io.netty:netty:3.10.6.Final'
    // 1.76（jdk18on）：jcifs-ng 的 SMB 登录需要新版 ASN.1 实现；1.65 会在
    // NegTokenInit.parse 抛 ClassCastException。全应用统一用这个版本即可。
    implementation 'org.bouncycastle:bcprov-jdk18on:1.76'

    // 网络音乐路径：SMB/CIFS 客户端（WebDAV 用 HttpURLConnection，FTP 自己实现，都不需要依赖）
    implementation 'eu.agno3.jcifs:jcifs-ng:2.1.10'

    // 动态图标（Lottie）：载入 / 等待这类动画用它，图标本身的路径动画仍用
    // 原生 AnimatedVectorDrawable（矢量、无额外资源、TV 盒子上更省）。
    implementation 'com.airbnb.android:lottie:6.6.0'

    testImplementation 'junit:junit:4.13.2'
}
